<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitleTag">Product Details — Global Tec</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/product-details.css">
<link rel="stylesheet" href="css/footer.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" style="display:none;">GT</span>
      <img src="images/logo.png" alt="Global Tec logo" class="brand-logo" onerror="this.style.display='none'; this.previousElementSibling.style.display='flex';">
      <span class="brand-name">Global<span>Tec</span></span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="products.html">All Laptops</a>
      <a href="products.html?condition=used">Used</a>
      <a href="compare.html">Compare</a>
    </nav>
    <div class="header-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="headerSearch" placeholder="Search laptops..." />
    </div>
    <div class="header-actions">
      <a href="compare.html" class="icon-btn" title="Compare">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        <span class="count" id="compareCount">0</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div class="breadcrumb" style="padding-top:var(--sp-5);">
    <a href="index.html">Home</a> / <a href="products.html">All Laptops</a> / <span id="breadcrumbName">...</span>
  </div>
</div>

<!-- ============ DETAILS ============ -->
<div class="container" id="detailsRoot">
  <div class="details-layout">
    <!-- Gallery -->
    <div>
      <div class="gallery-main">
        <img id="mainImage" src="" alt="" />
      </div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>
    </div>

    <!-- Info -->
    <div>
      <div class="details-brand" id="productBrand">—</div>
      <h1 class="details-title" id="productName">Loading...</h1>
      <div class="details-badges" id="productBadges"></div>

      <div class="details-price-card">
        <div class="details-price-row">
          <span class="price" id="productPrice">—</span>
          <span class="old-price" id="productOldPrice"></span>
        </div>
        <div class="stock-line" id="stockLine"><span class="dot"></span> Checking availability...</div>
        <div class="details-actions">
          <button class="btn btn-primary" id="addCompareBtn">+ Add to Compare</button>
          <a href="#" class="btn btn-ghost" id="contactBtn">Contact to Buy</a>
        </div>
      </div>

      <div class="quick-specs" id="quickSpecs"></div>
    </div>
  </div>

  <!-- Full specs -->
  <div class="specs-section">
    <div class="section-head">
      <div><span class="eyebrow">Specifications</span><h2>Full Details</h2></div>
    </div>
    <table class="specs-table" id="specsTable"></table>

    <div style="margin-top:var(--sp-6);">
      <div class="section-head" style="margin-bottom:var(--sp-3);">
        <div><span class="eyebrow">About</span><h2 style="font-size:var(--fs-lg);">Description</h2></div>
      </div>
      <p class="details-description" id="productDescription"></p>
    </div>
  </div>
</div>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Global Tec. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/data/products.js"></script>
<script src="js/services/products-service.js"></script>
<script src="js/components/compare-store.js"></script>
<script src="js/components/render-products.js"></script>
<script src="js/components/shared-ui.js"></script>
<script src="js/components/render-details.js"></script>
<script src="js/product-details-page.js"></script>
</body>
</html>
